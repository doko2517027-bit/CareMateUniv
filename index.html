<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#5b4bdb">
  <meta name="description" content="テスト対策に特化したCareMateUniv">
  <title>CareMateUniv</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
  <div id="loadingOverlay" class="loading-overlay" role="status" aria-live="polite">
    <span class="spinner" aria-hidden="true"></span>
    <strong id="loadingMessage">読み込み中…</strong>
  </div>

  <main id="authScreen" class="auth-screen" hidden>
    <section class="auth-brand">
      <span class="brand-mark">C</span>
      <p class="eyebrow">UNIVERSITY STUDY</p>
      <h1>CareMateUniv</h1>
      <p>テスト対策だけに集中できる学習アプリ</p>
    </section>
    <section class="auth-card">
      <div class="segmented" role="tablist">
        <button class="active" id="showLogin" type="button">ログイン</button>
        <button id="showRegister" type="button">新規登録</button>
      </div>

      <form id="loginForm" class="form-stack">
        <h2>ログイン</h2>
        <label>Active!Mailアドレス
          <span class="email-field"><input id="loginEmailLocal" autocomplete="username" required maxlength="80"><b>@sums.ac.jp</b></span>
        </label>
        <label>パスワード<input id="loginPassword" type="password" autocomplete="current-password" required minlength="8" maxlength="128"></label>
        <button class="primary-button" type="submit">ログイン</button>
      </form>

      <form id="registerForm" class="form-stack" hidden>
        <h2>新規登録</h2>
        <p class="hint">管理者から受け取った登録コードを使用します。学生登録では大学のActive!Mail確認が必要です。管理者として招待された場合は確認前でも利用開始できます。</p>
        <label>学籍番号<input id="registerStudentNumber" inputmode="numeric" pattern="[0-9]{7}" maxlength="7" required></label>
        <label>Active!Mailアドレス
          <span class="email-field"><input id="registerEmailLocal" autocomplete="email" required maxlength="80"><b>@sums.ac.jp</b></span>
        </label>
        <label>登録コード<input id="registerInviteCode" autocomplete="one-time-code" required maxlength="80"></label>
        <label>パスワード<input id="registerPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></label>
        <label>パスワード再入力<input id="registerPasswordConfirm" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></label>
        <button class="primary-button" type="submit">確認メールを送信</button>
      </form>
      <p id="authStatus" class="status" role="status"></p>
    </section>
  </main>

  <main id="verifyScreen" class="center-screen" hidden>
    <section class="message-card">
      <span class="message-icon">✉</span>
      <h1>メールを確認してください</h1>
      <p><strong id="verifyEmail"></strong> へ確認メールを送信しました。メール内のリンクを開いた後、この画面へ戻ってください。</p>
      <button id="checkVerification" class="primary-button" type="button">確認済みか再確認</button>
      <button id="resendVerification" class="secondary-button" type="button">確認メールを再送</button>
      <button id="verifyLogout" class="text-button" type="button">別のアカウントでログイン</button>
      <p id="verifyStatus" class="status"></p>
    </section>
  </main>

  <main id="activationScreen" class="center-screen" hidden>
    <form id="activationForm" class="message-card form-stack">
      <span class="message-icon">✓</span>
      <h1>登録を完了</h1>
      <p>メール確認が完了しました。管理者から受け取った情報を入力してください。</p>
      <label>学籍番号<input id="activationStudentNumber" inputmode="numeric" pattern="[0-9]{7}" maxlength="7" required></label>
      <label>登録コード<input id="activationInviteCode" autocomplete="one-time-code" required maxlength="80"></label>
      <button class="primary-button" type="submit">利用を開始</button>
      <button id="activationLogout" class="text-button" type="button">ログアウト</button>
      <p id="activationStatus" class="status"></p>
    </form>
  </main>

  <div id="appShell" class="app-shell" hidden>
    <header class="app-header">
      <div><span class="brand-mini">CareMateUniv</span><h1 id="pageTitle">テスト</h1></div>
      <button id="themeToggle" class="icon-button" type="button" aria-label="配色を切り替える">☾</button>
    </header>
    <main id="appContent" class="app-content"></main>
    <nav id="bottomNav" class="bottom-nav" aria-label="メインメニュー">
      <button type="button" data-page="test" class="active"><span>📖</span><b>テスト</b></button>
      <button type="button" data-page="settings"><span>⚙</span><b>設定</b></button>
      <button type="button" data-page="admin" id="adminNav" hidden><span>♛</span><b>管理</b></button>
    </nav>
  </div>

  <dialog id="appDialog" class="app-dialog"><div id="dialogContent"></div><button id="closeDialog" class="secondary-button" type="button">閉じる</button></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="app.js?v=1"></script>
</body>
</html>
